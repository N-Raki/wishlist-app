name: Deploy
description: Ships the database, the server functions, the website and the app update of one environment.
inputs:
  app-env:
    description: Value of EXPO_PUBLIC_APP_ENV and name of the EAS Update channel (preprod or production).
    required: true
  eas-environment:
    description: EAS environment (preview or production).
    required: true
  supabase-project-ref:
    required: true
  supabase-db-password:
    required: true
  web-flags:
    description: Flags for `eas deploy` (an alias, or --prod).
    required: true
  site-url:
    description: Address of the website, for links in e-mails sent by the server functions.
    required: true
  cron-secret:
    description: Secret of the daily clean-up of inactive accounts; nothing is set while empty.
    required: false
  brevo-api-key:
    description: Brevo API key, for e-mails sent by the server functions.
    required: false
  email-from:
    description: Sender address of those e-mails, authenticated in Brevo.
    required: false
outputs:
  url:
    description: Address of the deployed website.
    value: ${{ steps.web.outputs.url }}
runs:
  using: composite
  steps:
    - name: Database migrations
      shell: bash
      env:
        SUPABASE_DB_PASSWORD: ${{ inputs.supabase-db-password }}
        PROJECT_REF: ${{ inputs.supabase-project-ref }}
      run: npx supabase db push --project-ref "$PROJECT_REF"
    - name: Server functions
      shell: bash
      env:
        PROJECT_REF: ${{ inputs.supabase-project-ref }}
      run: npx supabase functions deploy --project-ref "$PROJECT_REF" --use-api
    - name: Server function secrets
      shell: bash
      env:
        PROJECT_REF: ${{ inputs.supabase-project-ref }}
        SITE_URL: ${{ inputs.site-url }}
        CRON_SECRET: ${{ inputs.cron-secret }}
        BREVO_API_KEY: ${{ inputs.brevo-api-key }}
        EMAIL_FROM: ${{ inputs.email-from }}
      run: |
        if [ -z "$CRON_SECRET" ]; then
          echo "CRON_SECRET is not set for this environment: inactive accounts are not cleaned up yet."
          exit 0
        fi
        npx supabase secrets set --project-ref "$PROJECT_REF" \
          "SITE_URL=$SITE_URL" "CRON_SECRET=$CRON_SECRET" "BREVO_API_KEY=$BREVO_API_KEY" "EMAIL_FROM=$EMAIL_FROM"
    - name: Website
      id: web
      shell: bash
      working-directory: apps/app
      env:
        EXPO_PUBLIC_APP_ENV: ${{ inputs.app-env }}
        EAS_ENVIRONMENT: ${{ inputs.eas-environment }}
        WEB_FLAGS: ${{ inputs.web-flags }}
      run: |
        npx expo export --platform web
        npx eas-cli deploy $WEB_FLAGS --environment "$EAS_ENVIRONMENT" --json > deploy.json
        echo "url=$(grep -o 'https://[^"]*expo\.app[^"]*' deploy.json | head -1)" >> "$GITHUB_OUTPUT"
    - name: App update (over the air)
      shell: bash
      working-directory: apps/app
      env:
        EXPO_PUBLIC_APP_ENV: ${{ inputs.app-env }}
        EAS_ENVIRONMENT: ${{ inputs.eas-environment }}
        MESSAGE: ${{ github.event.head_commit.message || github.sha }}
      run: >
        npx eas-cli update --channel "$EXPO_PUBLIC_APP_ENV" --environment "$EAS_ENVIRONMENT"
        --message "${MESSAGE%%$'\n'*}" --non-interactive
