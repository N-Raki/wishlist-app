name: Inactive accounts

# Once a day, warns the accounts unused for almost 3 years and deletes those warned 30 days ago
# (supabase/functions/inactive-accounts). Skipped in an environment until its CRON_SECRET is
# set (docs/setup.md).

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-up:
    if: vars.DEPLOY_ENABLED == 'true'
    strategy:
      fail-fast: false
      matrix:
        environment: [preprod, production]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{ matrix.environment }}
    steps:
      - name: Run the clean-up
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET is not set for this environment: skipped."
            exit 0
          fi
          curl --fail-with-body --silent --show-error -X POST \
            "https://$PROJECT_REF.supabase.co/functions/v1/inactive-accounts" \
            -H "Authorization: Bearer $CRON_SECRET"
